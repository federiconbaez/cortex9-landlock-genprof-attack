[package]
name = "landlock-genprof-attack"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Learn a Landlock+seccomp profile from a workload and prove it with an adversarial escape suite"
repository = "https://github.com/federiconbaez/cortex9-landlock-genprof-attack"
keywords = ["landlock", "seccomp", "sandbox", "security", "linux"]
categories = ["command-line-utilities", "os::linux-apis"]
authors = ["Federico Nicolas Báez Rizzo"]
default-run = "lgpa"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
landlock = "0.4.7"
seccompiler = "0.5"
nix = { version = "0.30.1", features = ["ptrace", "process", "signal", "fs"] }
libc = "0.2"

[dev-dependencies]
serde_json = "1"
libc = "0.2"

[[bin]]
name = "lgpa"
path = "src/main.rs"

[lib]
name = "landlock_genprof_attack"
path = "src/lib.rs"

[profile.release]
debug = false
