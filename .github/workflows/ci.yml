name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: kernel
        run: uname -a
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        # Integration tests hit the real kernel and FAIL (never skip) without
        # Landlock ABI >= 6.
        run: cargo test --workspace

  measure:
    name: medición demo (Landlock real, falla si no hay ABI 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: kernel + Landlock ABI
        run: |
          uname -a
          cargo build --release
          ./target/release/lgpa abi
      - name: reproducir medición demo
        # 87.8% is the honest full-suite number on ABI 6 (41 attacks including
        # documented Landlock gaps that share allowlisted syscalls). Gate at 85.
        run: ./target/release/lgpa measure --ws /tmp/lgpa-ws --json report.json --min-blocked-pct 85 --no-compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lgpa-report
          path: report.json

  measure-apps:
    name: medición multi-app (curl/http.server/sqlite3/nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: install sqlite3 + nginx
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 nginx
      - name: build
        run: cargo build --release && ./target/release/lgpa abi
      - name: measure-apps
        # sqlite3/nginx cannot be installed on the development box (apt mirror
        # 500 / package missing); they are measured here. Gate at 80 so a
        # wide python profile does not fail the job while we still require
        # every available app to report a real number.
        run: ./target/release/lgpa measure-apps --ws /tmp/lgpa-apps --json apps.json --min-blocked-pct 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lgpa-apps-report
          path: apps.json
